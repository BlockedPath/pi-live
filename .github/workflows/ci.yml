name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: extensions/pi-live/package-lock.json

      - name: Install dependencies
        working-directory: extensions/pi-live
        run: npm install

      - name: Typecheck
        working-directory: extensions/pi-live
        run: npm run typecheck
